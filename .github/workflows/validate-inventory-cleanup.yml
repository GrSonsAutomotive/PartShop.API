name: Validate Inventory Cleanup API (build only)
on:
  pull_request:
    branches: [dev]
    paths:
      - "Site_2024/**"
      - "Site_2024.sln"
      - ".github/workflows/validate-inventory-cleanup.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
      - run: dotnet restore Site_2024.sln
      - run: dotnet build Site_2024.sln --configuration Release --no-restore
