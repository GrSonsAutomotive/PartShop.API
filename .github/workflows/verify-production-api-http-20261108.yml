name: Read-only production API HTTP smoke (no deployment)

on:
  push:
    branches:
      - ci/verify-reference-deletion-20261108

permissions:
  contents: read

jobs:
  public-read-only-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public customer inventory HTTP response
        shell: bash
        run: |
          set -euo pipefail
          # No cookies, authorization, SQL writes, Shopify calls, or response body logs.
          endpoint="https://api.grsonsautomotive.com/api/home/available?pageIndex=0&pageSize=10"
          code="$(curl -sSL --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "$endpoint")"
          test "$code" = "200" || { echo "Expected HTTP 200 from public inventory; got $code"; exit 1; }
          echo "PASS production API read-only inventory endpoint returned HTTP 200"
