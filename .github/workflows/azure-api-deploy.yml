name: Build and deploy ASP.NET Core API to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: Site_2024/Site_2024.Web.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish
  AZURE_WEBAPP_NAME: site-2024-api

jobs:
  build:
    name: Build API
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build API
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_PATH }}"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-2024-api
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  deploy:
    name: Deploy API
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: site-2024-api
          path: ./publish

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COPY_ACTUAL_CLIENT_ID_SECRET_NAME_HERE }}
          tenant-id: ${{ secrets.COPY_ACTUAL_TENANT_ID_SECRET_NAME_HERE }}
          subscription-id: ${{ secrets.COPY_ACTUAL_SUBSCRIPTION_ID_SECRET_NAME_HERE }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
