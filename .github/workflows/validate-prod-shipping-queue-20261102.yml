name: Validate Production Shipping Queue Safety (BUILD ONLY)
on:
  push:
    branches:
      - release/prod-shipping-queue-safety-20261102
permissions:
  contents: read
jobs:
  build-no-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build API without Azure deployment
        run: dotnet build --configuration Release
