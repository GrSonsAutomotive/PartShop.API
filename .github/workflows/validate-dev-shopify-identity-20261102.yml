name: Validate DEV Shopify Identity (BUILD ONLY)
on:
  push:
    branches:
      - fix/dev-shopify-store-identity-check-20261102
permissions:
  contents: read
jobs:
  build-no-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Compile DEV identity check (no deploy)
        run: dotnet build --configuration Release
