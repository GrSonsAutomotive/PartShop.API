name: Validate DEV Shipping Legacy Rehearsal (BUILD ONLY)
on:
  push:
    branches:
      - feat/dev-shipping-legacy-rehearsal-20261102
permissions:
  contents: read
jobs:
  build-no-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Compile DEV rehearsal only
        run: dotnet build --configuration Release
